name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before suggesting a feature, check the ROADMAP.md to see if it's already planned.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Gameplay mechanic
        - AI behavior
        - UI / UX
        - Diplomacy
        - Economy
        - Military / Combat
        - Map / Provinces
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gameplay frustration or gap this addresses.
      placeholder: "e.g. It's hard to tell why my army keeps losing battles — I can't see what modifiers are being applied."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you considered?

  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      description: Check all that apply to your proposal
      options:
        - label: Must work with deterministic simulation (no RNG changes to LLM)
        - label: Should be keyboard-accessible
        - label: Should not require server-side logic
