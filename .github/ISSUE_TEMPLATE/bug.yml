name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much detail as possible.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly.
      placeholder: "e.g. Army disappeared after attacking a mountain province in winter."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start game as Qin
        2. Move army to Hanzhong (mountains)
        3. Attack Han province
        4. Army token vanishes
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: kingdom
    attributes:
      label: Playing as
      description: Which kingdom were you controlling?
      options:
        - Qin
        - Zhao
        - Yan
        - Qi
        - Wei
        - Han
        - Chu
        - Zhongshan
        - Other / Unknown
    validations:
      required: false

  - type: input
    id: game-day
    attributes:
      label: Game day / year (if known)
      placeholder: "e.g. Day 180, 473 BCE"

  - type: textarea
    id: additional
    attributes:
      label: Additional context / screenshots
      description: Add any other context about the problem here.
